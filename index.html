<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Directory</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="directory-header">
        <p class="header-label">EMPLOYEE DIRECTORY</p>

        <h1>Meet Our Team</h1>

        <p class="header-description">
            Search our employee directory to learn more about each team
            member, their department, skills, and contact information.
        </p>
    </header>

    <main>
        <section class="search-container">
            <span class="search-icon" aria-hidden="true">⌕</span>

            <label for="search" class="visually-hidden">
                Search employees
            </label>

            <input
                type="search"
                id="search"
                placeholder="Search by name, title, or department..."
                aria-label="Search employees"
            >

            <label for="department-filter" class="visually-hidden">
                Filter by department
            </label>

            <select id="department-filter">
                <option value="all">All Departments</option>
            </select>
        </section>

        <p id="results-count" aria-live="polite"></p>

        <section
            id="employee-list"
            class="employee-grid"
            aria-label="Employee profiles"
        >
            <!-- Employee cards appear here -->
        </section>
    </main>

    <footer>
        <p>Employee Directory App © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
